name: Pyodide

# The package in the browser: its wheel installed with micropip in Pyodide under Node, every
# module imported and the live demo of the docs (docs/src/components/*_demo.py) run with its
# defaults, with the shared workflow of max-models/starlight-theme. The kernels fall back to their
# NumPy versions there; their Pyccel sources (`*_pyccel`, which may import `pyccel`, not
# available in the browser) are not imported.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyodide:
    uses: max-models/starlight-theme/.github/workflows/pyodide.yml@v0
    with:
      skip: ".*_pyccel$"
