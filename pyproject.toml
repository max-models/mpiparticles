[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "mpiparticles"
version = "0.1.0"
description = "A distributed marker (particle) container for MPI codes: storage, ids, and migration to the owning rank."
readme = "README.md"
keywords = [ "cupy", "markers", "mpi", "numpy", "particles", "particle-in-cell" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# only version ranges: PyPI rejects direct references (git URLs); devel takes the max-models
# packages from their devel branches, see [tool.uv.sources]
dependencies = [
  "cunumpy>=0.7.1",
  "maybempi>=0.1.2",
  "mpiarray>=0.2.1",
  "numpy",
  "scope-profiler>=0.7.5",
]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "mpiparticles[docs,mpi,test]",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
]
# without mpi4py, mpiparticles runs serially on maybempi's stand-in for mpi4py.MPI;
# the tests that launch mpiexec need it
optional-dependencies.mpi = [ "mpi4py" ]
optional-dependencies.test = [ "pytest", "pytest-cov" ]
urls.Source = "https://github.com/max-models/mpiparticles"

[project.entry-points."scope_profiler.opt_in_tags"]
mpiparticles = "mpiparticles"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "mpiparticles" ]
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
maybempi = { git = "https://github.com/max-models/maybempi", branch = "devel" }
mpiarray = { git = "https://github.com/max-models/mpiarray", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
